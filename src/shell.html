<div id="app">
  <header id="hud">
    <a class="brand" href="#harbour" aria-label="Hundred Cannons by Funnal, home"><svg class="mark" aria-hidden="true"><use href="#funnal"/></svg><span><b>Hundred Cannons</b><small>A Funnal pirate game</small></span></a>
    <div class="hudRight">
      <button class="mute" id="mute" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="x" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="glow" id="glowBox" aria-label="Glowpennies, open shop"><span class="gem"></span><b id="glowNum">0</b></button>
      <button id="who" class="who" aria-label="Your islet"><span id="whoAv" class="av"></span></button>
    </div>
    <div class="lvlRow">
      <span class="lvlBadge">Lv <b id="lvlNum">1</b></span>
      <div class="xpbar"><i id="xpFill"></i></div>
      <span class="xpTxt" id="xpTxt">0 / 75 XP</span>
      <span class="whoTxt"><b id="whoName">Keeper</b> · <small id="whoTitle">Apprentice</small></span>
    </div>
  </header>
  <div id="sync" class="sync" hidden></div>
  <main id="screen" tabindex="-1"></main>
  <section id="actions" aria-label="Log outreach">
    <div class="smallBtns">
      <button class="act" data-k="r" id="b_r"><span class="ico c-r"><svg><use href="#i-resp"/></svg></span><span>Response</span></button>
      <button class="act" data-k="v" id="b_v"><span class="ico c-v"><svg><use href="#i-video"/></svg></span><span>Video</span></button>
      <button class="act" data-k="m" id="b_m"><span class="ico c-m"><svg><use href="#i-meet"/></svg></span><span>Meeting</span></button>
      <button class="act" data-k="c" id="b_c"><span class="ico c-c"><svg><use href="#i-star"/></svg></span><span>Client</span></button>
    </div>
    <div class="dmRow">
      <button id="undo" class="undo" aria-label="Undo last log"><svg><use href="#i-undo"/></svg></button>
      <button class="dm" data-k="d" id="b_d" aria-label="DM sent">
        <span class="dmIcon" aria-hidden="true"><svg class="mk"><use href="#funnal"/></svg><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="track"/><circle cx="50" cy="50" r="44" class="prog" id="cdRing"/></svg></span>
        <span class="dmLabel"><b>DM sent</b><small id="dmSub">hold for follow-ups</small></span>
        <span class="fuFace" aria-hidden="true"><span class="fuIcon"><svg viewBox="0 0 24 24"><path d="M9.2 2.6h5.6v2.2h-.9v3.1c2.5 1 4.1 3.3 4.1 6v5.4c0 1.2-1 2.1-2.2 2.1H8.2c-1.2 0-2.2-.9-2.2-2.1V13.9c0-2.7 1.6-5 4.1-6V4.8h-.9z" fill="#2F6F8F"/><path d="M8.6 13.2h6.8v4.6H8.6z" fill="#FFF3D6"/><path d="M9.6 14.6h4.8M9.6 16.4h3.4" stroke="#B98A4A" stroke-width=".9" stroke-linecap="round"/><path d="M9.6 1.6h4.8v1.8H9.6z" fill="#B98A4A"/></svg></span><span class="dmLabel"><b>Follow-up</b><small id="fuSub">hold for DMs</small></span></span>
      </button>
      <div class="todayMini"><b id="myToday">0</b><small id="myTodayL">today</small></div>
    </div>
  </section>
  <nav id="tabs" aria-label="Screens">
    <a href="#harbour" data-s="harbour"><svg><use href="#t-harbour"/></svg>Harbour</a>
    <a href="#ship" data-s="ship"><svg><use href="#t-ship"/></svg>Ship</a>
    <a href="#lockin" data-s="lockin"><svg><use href="#t-lock"/></svg>Lock In</a>
    <a href="#quests" data-s="quests"><svg><use href="#t-quest"/></svg>Quests</a>
    <a href="#shop" data-s="shop"><svg><use href="#t-shop"/></svg>Shop</a>
    <a href="#more" data-s="more"><svg><use href="#t-more"/></svg>More</a>
  </nav>
</div>
<div id="fx" aria-hidden="true"></div>
<canvas id="fireworks" aria-hidden="true"></canvas>
<div id="toasts" aria-live="polite"></div>
